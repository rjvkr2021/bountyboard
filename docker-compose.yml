name: bountyboard

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bountyboard}
      POSTGRES_USER: ${POSTGRES_USER:-bountyboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bountyboard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bountyboard}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env or the shell}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      PLATFORM_DATA_FILE: /data/platform.json
      PLATFORM_BOARD_WASM: /wasm/bounty_board.wasm
      PLATFORM_SPUTNIK_WASM: /wasm/sputnikdao2.wasm
    volumes:
      - platform-data:/data
      - ./contracts/bounty-board/target/near/bounty_board.wasm:/wasm/bounty_board.wasm:ro
      - ./.cache/sputnikdao2.wasm:/wasm/sputnikdao2.wasm:ro

volumes:
  postgres-data:
  platform-data:
